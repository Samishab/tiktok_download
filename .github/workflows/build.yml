name: Build EXE
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onedir --windowed --name VideoDownloader --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all curl_cffi --collect-all customtkinter app.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/VideoDownloader/* -DestinationPath VideoDownloader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows
          path: VideoDownloader-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoDownloader-windows.zip
